<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Unfret</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <h1 class="brand"><img src="../icons/icon-32.png" width="20" height="20" alt="" />Unfret</h1>
      <nav class="row">
        <a id="about" href="#" class="link" data-i18n="about">About &amp; privacy</a>
        <a id="options" href="#" class="link" data-i18n="settings">Settings</a>
      </nav>
    </header>

    <section id="consent" class="card" aria-labelledby="consent-heading" hidden>
      <h2 id="consent-heading" data-i18n="consent_heading">Before your first check</h2>
      <h3 data-i18n="consent_what_title">What Unfret does</h3>
      <p class="small" data-i18n="consent_what_body"></p>
      <h3 data-i18n="consent_sent_title">What is sent, and when</h3>
      <p class="small" data-i18n="consent_sent_body"></p>
      <h3 data-i18n="consent_pay_title">Paying for checks</h3>
      <p class="small" data-i18n="consent_pay_body"></p>
      <p class="small">
        <a id="privacy" href="#" class="link" data-i18n="consent_privacy">Read the privacy statement</a>
      </p>
      <p id="consent-agreed" class="muted small" hidden data-i18n="consent_agreed"></p>
      <div class="row">
        <button id="consent-agree" type="button" class="primary" data-i18n="consent_agree">I agree</button>
        <button id="consent-close" type="button" class="secondary" hidden data-i18n="consent_close">
          Close
        </button>
      </div>
    </section>

    <section id="account" class="card" data-i18n-label="account_label" aria-label="Account">
      <p id="account-status">Not signed in.</p>
      <p id="account-until" class="muted small" hidden></p>
      <p id="credits" class="muted" hidden></p>
      <div class="row">
        <button id="sign-in" type="button" class="secondary" data-i18n="sign_in_wallet">
          Sign in with a Solana wallet
        </button>
        <button id="sign-in-phone" type="button" class="secondary" data-i18n="sign_in_phone">
          Sign in with phone
        </button>
        <button id="buy" type="button" class="secondary" hidden data-i18n="buy_checks">Buy checks</button>
        <button id="sign-out" type="button" class="secondary" hidden data-i18n="sign_out">Sign out</button>
      </div>
    </section>

    <section id="phone" class="card" aria-labelledby="phone-heading" hidden>
      <h2 id="phone-heading" data-i18n="phone_heading">Sign in with your phone</h2>
      <p class="small" data-i18n="phone_help"></p>
      <div id="phone-qr" class="qr"></div>
      <p class="small" data-i18n="phone_same_code">Check that your phone shows the same code:</p>
      <p id="phone-code" class="code" aria-live="polite"></p>
      <p id="phone-status" class="muted small" role="status" aria-live="polite"></p>
      <div class="row">
        <button id="phone-retry" type="button" class="secondary" hidden data-i18n="try_again">
          Try again
        </button>
        <button id="phone-cancel" type="button" class="secondary" data-i18n="cancel">Cancel</button>
      </div>
    </section>

    <section class="card" data-i18n-label="page_label" aria-label="This page">
      <button id="analyse" type="button" class="primary" disabled data-i18n="analyse">Check this page</button>
      <p id="hint" class="muted"></p>
    </section>

    <section id="progress" class="card" data-i18n-label="progress_label" aria-label="Progress" hidden>
      <p id="progress-status" role="status" aria-live="polite"></p>
      <ul id="steps" class="checklist"></ul>
    </section>

    <section
      id="result"
      class="card"
      data-i18n-label="result_label"
      aria-label="Result"
      aria-live="polite"
      hidden
    >
      <div id="result-body"></div>
      <p id="report-open-row" class="small" hidden>
        <a id="report-open" href="#" class="link" data-i18n="report_open">This is wrong</a>
      </p>
      <form id="report" hidden>
        <fieldset>
          <legend data-i18n="report_heading">What is this page really?</legend>
          <label
            ><input type="radio" name="reason" value="real_brand" />
            <span data-i18n="report_real_brand"></span
          ></label>
          <label
            ><input type="radio" name="reason" value="scam" /> <span data-i18n="report_scam"></span
          ></label>
          <label
            ><input type="radio" name="reason" value="junk" /> <span data-i18n="report_junk"></span
          ></label>
          <label
            ><input type="radio" name="reason" value="other" /> <span data-i18n="report_other"></span
          ></label>
        </fieldset>
        <p class="muted small" data-i18n="report_consent"></p>
        <div class="row">
          <button id="report-send" type="submit" class="secondary" disabled data-i18n="report_send">
            Send report
          </button>
          <button id="report-cancel" type="button" class="secondary" data-i18n="cancel">Cancel</button>
        </div>
      </form>
      <p id="report-status" class="muted small" role="status" aria-live="polite" hidden></p>
    </section>

    <section id="error" class="card error" role="alert" hidden>
      <p id="error-message"></p>
      <p id="error-refunded" class="muted small" hidden data-i18n="no_check_used"></p>
      <div class="row">
        <button id="error-sign-in" type="button" class="secondary" hidden data-i18n="sign_in_again">
          Sign in again
        </button>
        <button id="error-buy" type="button" class="secondary" hidden data-i18n="buy_checks">
          Buy checks
        </button>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>

name: Release to the extension stores

# Production Unfret is released only by hand: Actions → "Release to the extension stores" → Run workflow. Nothing runs
# here automatically. Leave `ref` at `main` to release main's newest commit as v<version in package.json> (refused if
# that tag already names another commit, so bump the version first). Or give an existing release tag, e.g. v0.8.4, to
# package that release again. Either way the commit must be on main, with CI passed and the same commit published as
# Unfret Dev.
#
# It builds the store packages, checks them (scripts/store-package.mjs: package.json's version, production API, no
# `key` or `update_url`) and attaches them with their checksums to the Forgejo release v<version>: the Chrome zip,
# the Firefox zip and the source zip addons.mozilla.org asks for. Then it submits them to the stores picked in
# `stores` (scripts/store-publish.mjs): the Chrome zip to the Chrome Web Store item for review, the Firefox zip with
# its source as a new listed version on addons.mozilla.org. Each store is its own step: one failing doesn't stop the
# other, a store whose secrets aren't set is skipped with a notice, and a version a store already has is left alone,
# so a run can be repeated.
#
# Order guard: nothing goes to a store unless production's backend (https://unfret.net/v1/health) runs at least
# package.json's `minBackendVersion`: newer extensions send page data older backends refuse. Deploy the backend first.
#
# `dry_run` (on by default) builds and checks everything, runs the order guard (a failure is a warning) and prints
# every store request a real run would send, without secrets; it attaches nothing and creates no tag or release.
#
# Repo secrets (Settings → Actions → Secrets; store/SUBMIT.md says how to get them): CWS_PUBLISHER_ID and
# CWS_SERVICE_ACCOUNT_KEY (a service account's JSON key) for the Chrome Web Store, or instead of the key the OAuth
# fallback CWS_CLIENT_ID, CWS_CLIENT_SECRET and CWS_REFRESH_TOKEN; AMO_JWT_ISSUER and
# AMO_JWT_SECRET for addons.mozilla.org, and optionally AMO_APPROVAL_NOTES (the notes to the reviewer, with the test
# key). They reach only the two submit steps, on the deploy runner.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "main (release main's newest commit) or an existing release tag such as v0.8.4"
        required: true
        default: main
        type: string
      stores:
        description: "Submit to: both, chrome, firefox, or none (only build and attach)"
        required: true
        default: both
        type: choice
        options: [both, chrome, firefox, none]
      dry_run:
        description: "Dry run: build, check and show the store requests; attach and submit nothing"
        required: true
        default: true
        type: boolean

concurrency:
  group: release-unfret-store
  cancel-in-progress: false

jobs:
  release-store:
    runs-on: kroshtan-deploy
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check the release
        id: release
        env:
          REF: ${{ inputs.ref }}
          STORES: ${{ inputs.stores }}
          DRY_RUN: ${{ inputs.dry_run }}
          API: ${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}
        run: |
          set -euo pipefail
          dry="$([[ "$DRY_RUN" == true ]] && echo true || echo false)"
          # What a real run refuses, a dry run only warns about, so it can show everything else.
          fail() {
            if [[ "$dry" == true ]]; then
              echo "::warning::(dry run; a real run stops here) $*"
            else
              echo "::error::$*"
              exit 1
            fi
          }
          git fetch -q --tags origin main
          if [[ "$REF" == main ]]; then
            sha="$(git rev-parse origin/main)"
            git checkout -q "$sha"
            version="$(node -p 'require("./package.json").version')"
            tag="v$version"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::package.json version '$version' is not a release version"; exit 1; }
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              [[ "$(git rev-parse "$tag^{commit}")" == "$sha" ]] \
                || fail "$tag already names another commit: bump the version in package.json first"
            fi
          else
            tag="$REF"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::'$tag' is not main or a release tag like v0.8.4"; exit 1; }
            git rev-parse -q --verify "refs/tags/$tag" > /dev/null \
              || { echo "::error::tag $tag does not exist"; exit 1; }
            sha="$(git rev-parse "$tag^{commit}")"
            version="$(node -p 'require("./package.json").version')"
            [[ "v$version" == "$tag" ]] || { echo "::error::$tag has package.json version $version"; exit 1; }
          fi
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$tag ($sha) is not on main"; exit 1; }
          # The repository is public, so its commit statuses can be read without a token.
          green="$(curl -fsS "$API/commits/$sha/status" | node -e '
            const { statuses = [] } = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const state = Object.fromEntries(statuses.map((s) => [s.context, s.status]));
            const bad = ["CI / check (push)", "CI / publish-dev (push)"].filter((c) => state[c] !== "success");
            console.log(bad.map((c) => `${c}=${state[c] ?? "missing"}`).join(", "));')"
          if [[ -n "$green" ]]; then
            fail "not green on main/dev for this commit: $green"
          else
            echo "check and publish-dev succeeded for this commit"
          fi
          chrome=false
          firefox=false
          [[ "$STORES" == both || "$STORES" == chrome ]] && chrome=true
          [[ "$STORES" == both || "$STORES" == firefox ]] && firefox=true
          if [[ "$STORES" != none && ! -f scripts/store-publish.mjs ]]; then
            echo "::error::$tag predates automated store submission: run with stores=none and upload by hand" \
              "(store/SUBMIT.md, store/AMO.md)"
            exit 1
          fi
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "version=$version"
            echo "dry_run=$dry"
            echo "chrome=$chrome"
            echo "firefox=$firefox"
          } >> "$FORGEJO_OUTPUT"
          echo "Packaging $tag ($sha) for the extension stores (stores: $STORES, dry run: $dry)"
      # The order guard, before anything is tagged: the same check runs again right before each submission.
      - name: Check the production backend
        if: inputs.stores != 'none'
        env:
          DRY: ${{ steps.release.outputs.dry_run == 'true' && '--dry-run' || '' }}
        run: node scripts/store-publish.mjs --gate-only $DRY
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build and check the store package
        id: package
        run: |
          set -euo pipefail
          npm run build
          node scripts/store-package.mjs
          cat dist/store/SHA256SUMS
      - name: Attach it to the release
        id: attach
        if: steps.release.outputs.dry_run != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
          TOKEN: ${{ forgejo.token }}
          API: ${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}
          SERVER: ${{ forgejo.server_url }}
          REPO: ${{ forgejo.repository }}
        run: |
          set -euo pipefail
          auth="Authorization: token $TOKEN"
          # Creating the release creates its tag on $SHA when the tag doesn't exist yet.
          code="$(curl -sS -o release.json -w '%{http_code}' -H "$auth" "$API/releases/tags/$TAG")"
          if [[ "$code" == 200 ]]; then
            id="$(node -p 'require("./release.json").id')"
          elif [[ "$code" != 404 ]]; then
            echo "::error::looking up release $TAG: HTTP $code"
            exit 1
          else
            body="$(node -p 'JSON.stringify({
              tag_name: process.env.TAG,
              target_commitish: process.env.SHA,
              name: `Unfret ${process.env.VERSION}`,
              body: `The store packages of Unfret ${process.env.VERSION}: unfret-chrome-${process.env.VERSION}.zip ` +
                `for the Chrome Web Store (store/SUBMIT.md), unfret-firefox-${process.env.VERSION}.zip and ` +
                `unfret-source-${process.env.VERSION}.zip for addons.mozilla.org (store/AMO.md). SHA256SUMS ` +
                "lists their checksums; `npm ci && npm run build` rebuilds them byte for byte from this tag.",
            })')"
            id="$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d "$body" "$API/releases" \
              | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).id')"
            echo "created release $TAG"
          fi
          existing="$(curl -fsS -H "$auth" "$API/releases/$id/assets" \
            | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).map((a) => a.name).join("\n")')"
          for file in dist/store/*; do
            name="$(basename "$file")"
            if grep -qxF "$name" <<< "$existing"; then
              if [[ "$name" != SHA256SUMS ]]; then
                echo "$name is already attached"
                continue
              fi
              # The checksums grow when a package is added to an older release: replace them.
              asset="$(curl -fsS -H "$auth" "$API/releases/$id/assets" \
                | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).find((a) => a.name === "SHA256SUMS").id')"
              curl -fsS -o /dev/null -X DELETE -H "$auth" "$API/releases/$id/assets/$asset"
            fi
            curl -fsS -o /dev/null -X POST -H "$auth" -F "attachment=@$file" \
              "$API/releases/$id/assets?name=$name"
            echo "attached $name"
          done
          echo "::notice::Unfret $VERSION is attached to $SERVER/$REPO/releases/tag/$TAG."
      # The stores. Each runs once the packages are built (and attached, outside a dry run), whatever the other did.
      - name: Submit to the Chrome Web Store
        if: >-
          !cancelled() && steps.release.outputs.chrome == 'true' && steps.package.outcome == 'success' &&
          steps.attach.outcome != 'failure'
        env:
          DRY: ${{ steps.release.outputs.dry_run == 'true' && '--dry-run' || '' }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: node scripts/store-publish.mjs --chrome $DRY
      - name: Submit to addons.mozilla.org
        if: >-
          !cancelled() && steps.release.outputs.firefox == 'true' && steps.package.outcome == 'success' &&
          steps.attach.outcome != 'failure'
        env:
          DRY: ${{ steps.release.outputs.dry_run == 'true' && '--dry-run' || '' }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_APPROVAL_NOTES: ${{ secrets.AMO_APPROVAL_NOTES }}
        run: node scripts/store-publish.mjs --firefox $DRY

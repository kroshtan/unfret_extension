name: CI

on:
  push:
    branches: [main]
  # A pull request is checked once it is ready: not while its title starts with "WIP:" or "[WIP]" (a draft), and
  # dropping that prefix (an `edited` event; Forgejo has no `ready_for_review`) starts the run (README, "Pull
  # requests and CI").
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# Forgejo applies `concurrency` to whole runs only (a job's own `concurrency` is ignored). A pull request's newer
# commit cancels its older run; an edit never cancels anything, it queues. On main, runs queue one behind the other
# and are never cancelled, so a publish is never cut off or dropped; a superseded run skips its checks instead
# (check, "Still needed?").
concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' && forgejo.event.action != 'edited' }}

jobs:
  # The public runner: an unprivileged throwaway container with no docker socket and no secrets.
  check:
    if: forgejo.event_name != 'pull_request' || !forgejo.event.pull_request.draft
    runs-on: kroshtan-public
    outputs:
      checked: ${{ steps.gate.outputs.run }}
    steps:
      # Is this check still needed? (README, "Pull requests and CI".) On main, runs queue one behind the other,
      # and a run whose commit is no longer the branch's newest checks nothing: the newer commit's own run checks it.
      # On a pull request, an edit that leaves it ready (a new description or title) reports the result its commit
      # already has instead of checking it again; dropping "WIP:" (the commit has no result yet) runs the checks.
      - name: Still needed?
        id: gate
        env:
          API: ${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}
          EVENT: ${{ forgejo.event_name }}
          ACTION: ${{ forgejo.event.action }}
          SHA: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          BRANCH: ${{ forgejo.ref_name }}
          RUN: ${{ forgejo.run_number }}
          CONTEXT: CI / ${{ forgejo.job }} (pull_request)
        run: |
          python3 -I - <<'PY'
          import json, os, sys, urllib.parse, urllib.request

          env = os.environ

          def get(path):
              # The repository is public: its branches and commit statuses need no token.
              with urllib.request.urlopen(env["API"] + path, timeout=30) as response:
                  return json.load(response)

          def decide(run, why):
              print(why)
              with open(env.get("FORGEJO_OUTPUT") or env["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"run={run}\n")
              sys.exit()

          if env["EVENT"] in ("push", "workflow_dispatch"):
              tip = get("/branches/" + urllib.parse.quote(env["BRANCH"], safe=""))["commit"]["id"]
              if tip != env["SHA"]:
                  decide("false", f"::notice::superseded: {env['BRANCH']} is at {tip} now; that commit's run checks it")
          elif env["EVENT"] == "pull_request" and env["ACTION"] == "edited":
              statuses = get(f"/commits/{env['SHA']}/statuses?sort=highestindex&limit=50")
              earlier = [
                  s for s in statuses
                  if s["context"] == env["CONTEXT"] and f"/runs/{env['RUN']}/" not in (s["target_url"] or "")
              ]
              if earlier:
                  last = max(earlier, key=lambda s: s["id"])
                  if last["status"] == "success":
                      decide("false", f"::notice::this commit already passed: {last['target_url']}")
                  if last["status"] == "failure" and last["description"].startswith("Failing"):
                      print(f"::error::this commit already failed: {last['target_url']} (push a fix or re-run it)")
                      sys.exit(1)
          decide("true", "checking this commit")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci
      - name: Lint
        if: steps.gate.outputs.run == 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.gate.outputs.run == 'true'
        run: npm run typecheck
      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: npm test
      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: npm run build
      - name: Lint the Firefox build (AMO rules)
        if: steps.gate.outputs.run == 'true'
        run: npx web-ext lint --source-dir dist/firefox
      - name: Check the store package
        if: steps.gate.outputs.run == 'true'
        run: node scripts/store-package.mjs
      # The release workflow's submit steps without store secrets (this runner has none): every store is skipped with a
      # notice and the run passes, so a store whose secrets aren't set yet (Edge Add-ons, until Partner Center is
      # set up) never fails a release. The order guard is tested in test/store-publish.test.ts; here a stand-in
      # health answer lets the real run through it without asking production.
      - name: Without store secrets, a release skips the stores
        if: steps.gate.outputs.run == 'true'
        env:
          UNFRET_HEALTH_URL: 'data:application/json,{"version":"999.0.0"}'
          CWS_CLIENT_ID: ""
          CWS_SERVICE_ACCOUNT_KEY: ""
          AMO_JWT_ISSUER: ""
          EDGE_PRODUCT_ID: ""
        run: |
          set -euo pipefail
          node scripts/store-publish.mjs | tee store-publish.log
          for store in chrome firefox edge; do
            grep -qx "::notice::$store: skipped (no secrets)" store-publish.log
          done

  # Unfret Dev, on every push to main (and manual runs on main): build it as version <package.json>.<run number>,
  # sign it with the dev key, and propose it to the backend, which serves it at
  # https://dev.unfret.net/extension/updates-dev.xml. That backend pull request merges itself once the
  # backend's CI passes, and the backend's own pipeline then deploys it to dev; installed copies update within
  # hours. Production is never published from here: see release-store.yaml (manual, Chrome Web Store).
  #
  # The deploy runner, because this job holds secrets; it uses neither docker nor /creds, only node and npm.
  # Repo secrets (Settings → Actions → Secrets): DEV_CRX_KEY, the PEM of Unfret Dev's signing key (ID
  # phokojgbhkfcejnnocokabdjoljdfgpl), and BACKEND_TOKEN, a token of an account that may push branches to and
  # open pull requests on the backend repository (scope write:repository).
  publish-dev:
    needs: check
    # Only a commit whose own checks ran and passed: a superseded run checks nothing, and the newer commit's run
    # publishes instead.
    if: >-
      forgejo.event_name != 'pull_request' && forgejo.ref == 'refs/heads/main'
      && needs.check.outputs.checked == 'true'
    runs-on: kroshtan-deploy
    container:
      image: node:22-bookworm
    concurrency:
      group: publish-unfret-dev
      cancel-in-progress: false
    env:
      UNFRET_DEV_BUILD: ${{ forgejo.run_number }}
      BACKEND_REPO: kroshtan/unfret_backend
      BACKEND_BRANCH: extension-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Sign Unfret Dev
        env:
          DEV_CRX_KEY: ${{ secrets.DEV_CRX_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$DEV_CRX_KEY" ]] || { echo "::error::repo secret DEV_CRX_KEY is not set"; exit 1; }
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$DEV_CRX_KEY" > "$key"
          # release.mjs refuses a key whose ID isn't release/dev-extension-id.txt's.
          UNFRET_DEV_CRX_KEY="$key" node scripts/release.mjs --dev
          node scripts/verify-release.mjs --dev dist/release/unfret-dev-*.crx
      - name: Propose it to the backend
        env:
          BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN }}
          SERVER: ${{ forgejo.server_url }}
          SHA: ${{ forgejo.sha }}
          REPO: ${{ forgejo.repository }}
        run: |
          set -euo pipefail
          [[ -n "$BACKEND_TOKEN" ]] || { echo "::error::repo secret BACKEND_TOKEN is not set"; exit 1; }
          api="$SERVER/api/v1/repos/$BACKEND_REPO"
          auth="Authorization: token $BACKEND_TOKEN"
          basic="$(printf 'ci:%s' "$BACKEND_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          git_auth=(-c http.extraHeader="Authorization: Basic $basic")
          version="$(node -p 'require("./dist/chrome-dev/manifest.json").version')"
          git "${git_auth[@]}" clone -q --depth 1 --branch main "$SERVER/$BACKEND_REPO.git" backend
          node scripts/publish-dev.mjs backend
          git -C backend add -A src
          if git -C backend diff --cached --quiet; then
            echo "the backend already serves Unfret Dev $version"
            exit 0
          fi
          git -C backend -c user.name="Unfret extension CI" -c user.email="noreply@git.kroshtan.com" commit -q \
            -m "Unfret Dev $version" -m "Built and signed by $REPO's CI (run $UNFRET_DEV_BUILD) from $REPO@$SHA."
          # One branch for every dev publish: a newer build replaces a pending one instead of conflicting with it.
          git -C backend "${git_auth[@]}" push -q -f origin "HEAD:refs/heads/$BACKEND_BRANCH"
          head="$(git -C backend rev-parse HEAD)"

          number="$(curl -fsS -H "$auth" "$api/pulls?state=open&limit=50" | node -e '
            const pulls = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const pull = pulls.find((p) => p.head.ref === process.env.BACKEND_BRANCH && p.base.ref === "main");
            console.log(pull ? pull.number : "");')"
          if [[ -z "$number" ]]; then
            body="$(VERSION="$version" node -p 'JSON.stringify({
              head: process.env.BACKEND_BRANCH,
              base: "main",
              title: `Unfret Dev ${process.env.VERSION}`,
              body: `Unfret Dev ${process.env.VERSION} from ${process.env.REPO}@${process.env.SHA}, built and signed ` +
                `by its CI (run ${process.env.UNFRET_DEV_BUILD}). Only the dev channel changes: unfret-dev-*.crx, ` +
                "updates-dev.xml and their SHA256SUMS lines. It merges itself when CI passes.",
            })')"
            number="$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d "$body" "$api/pulls" \
              | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).number')"
          fi
          echo "backend pull request: $SERVER/$BACKEND_REPO/pulls/$number"

          # Schedule the merge only once the backend's CI has reported on this commit: with no status at all,
          # "merge when checks succeed" could merge at once.
          count=0
          for _ in $(seq 60); do
            count="$(curl -fsS -H "$auth" "$api/commits/$head/status" \
              | node -p '(JSON.parse(require("fs").readFileSync(0, "utf8")).statuses ?? []).length')"
            ((count > 0)) && break
            sleep 5
          done
          ((count > 0)) || { echo "::warning::no CI status on $head after 5 minutes: merge #$number by hand"; exit 0; }
          code="$(curl -sS -o merge.out -w '%{http_code}' -X POST -H "$auth" -H "Content-Type: application/json" \
            -d '{"Do": "merge", "merge_when_checks_succeed": true, "delete_branch_after_merge": true}' \
            "$api/pulls/$number/merge")"
          case "$code" in
            200 | 201 | 204) echo "#$number merges when the backend's CI passes" ;;
            409) echo "#$number: merge already scheduled ($(cat merge.out))" ;;
            *) echo "::warning::could not schedule the merge of #$number (HTTP $code: $(cat merge.out)): merge it by hand" ;;
          esac
